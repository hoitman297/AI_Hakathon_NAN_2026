plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gameproject'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Mockito 5's inline mock maker(기본값)는 실행 중 자기 자신을 Java agent로 self-attach하는데,
// JDK 21 + Gradle 테스트 워커 환경에서 이게 완전히 성공하지 못해 Anthropic SDK의 final 클래스
// (Message, StructuredMessage 등)를 mock()할 때 UnfinishedStubbingException이 났다.
// JVM 시작 시점에 -javaagent로 미리 로드하면 이 문제가 해결된다(Mockito 공식 권장 방식).
configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'com.anthropic:anthropic-java:2.34.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

// backend와 동일한 이유(@PathVariable/@RequestParam 이름 해석 안정성) — 현재는 이 모듈에
// @PathVariable을 쓰는 컨트롤러가 없지만, 앞으로 추가될 때를 대비해 미리 맞춰둔다.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}
