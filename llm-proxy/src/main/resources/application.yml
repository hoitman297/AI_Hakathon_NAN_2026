spring:
  application:
    name: llm-proxy
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8081}

# 배포 플랫폼(Render 등)이 이 서비스의 생존 여부를 확인할 수 있도록 헬스체크만 공개
# 노출한다 (InternalApiKeyFilter는 /internal/** 만 막으므로 /actuator/health는 그대로 통과됨).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

anthropic:
  api-key: ${LLM_API_KEY}
  model: ${LLM_MODEL:claude-opus-5}
  # 대화(chat)만 실시간성이 중요해 더 빠른 모델을 따로 쓴다 — 페르소나/엔딩/단서 등
  # 품질이 더 중요한 나머지 생성은 여전히 위 model(Opus)을 쓴다.
  chat-model: ${LLM_CHAT_MODEL:claude-sonnet-5}

internal:
  api-key: ${INTERNAL_API_KEY}
