spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:game_project}?sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  llm-proxy:
    base-url: ${LLM_PROXY_URL:http://localhost:8081}
    api-key: ${INTERNAL_API_KEY}
  llm-rate-limit:
    max-calls: ${LLM_RATE_LIMIT_MAX_CALLS:20}
    window-seconds: ${LLM_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
