spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:game_project}?sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        # 세션 생성 시 NPC 수만큼 도는 affinity INSERT 등, 같은 타입 반복 저장을 묶어서
        # DB 왕복 횟수를 줄인다 (order_inserts/updates가 있어야 배치가 실제로 묶여서 나간다).
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8080}

# SessionOwnershipInterceptor가 MDC에 심어둔 sessionId를 기본 콘솔 로그 패턴에 끼워 넣는다
# (Spring Boot 공식 관례: logging.pattern.level로 MDC 값을 로그 레벨 옆에 붙임). sessionId가
# 없는 로그(요청 컨텍스트 밖)에서는 %X{sessionId:-}가 빈 문자열로 빠진다.
logging:
  pattern:
    level: "%5p [session=%X{sessionId:-}]"

# 배포 플랫폼(Render 등)이 앱 생존 여부를 확인할 수 있도록 헬스체크만 공개 노출한다.
# health는 인증 없이 누구나 호출 가능하므로 DB 연결 실패 같은 내부 사정을 굳이 노출하지
# 않도록 show-details는 기본값(never)을 명시적으로 유지 — 전체 상태(200/503)는 그대로
# 정확히 반영되므로 헬스체크 용도로는 지장 없다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  llm-proxy:
    base-url: ${LLM_PROXY_URL:http://localhost:8081}
    api-key: ${INTERNAL_API_KEY}
  llm-rate-limit:
    max-calls: ${LLM_RATE_LIMIT_MAX_CALLS:20}
    window-seconds: ${LLM_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
