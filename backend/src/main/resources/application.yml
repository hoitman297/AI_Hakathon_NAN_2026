spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:game_project}?sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

# 배포 플랫폼(Render 등)이 앱 생존 여부를 확인할 수 있도록 헬스체크만 공개 노출한다.
# health는 인증 없이 누구나 호출 가능하므로 DB 연결 실패 같은 내부 사정을 굳이 노출하지
# 않도록 show-details는 기본값(never)을 명시적으로 유지 — 전체 상태(200/503)는 그대로
# 정확히 반영되므로 헬스체크 용도로는 지장 없다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  llm-proxy:
    base-url: ${LLM_PROXY_URL:http://localhost:8081}
    api-key: ${INTERNAL_API_KEY}
  llm-rate-limit:
    max-calls: ${LLM_RATE_LIMIT_MAX_CALLS:20}
    window-seconds: ${LLM_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
